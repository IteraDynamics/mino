openapi: 3.0.3
info:
  title: Mino Agentic Commerce Control Plane
  version: 0.4.0
  description: >-
    Policy, authorization, approval, and security firewall for agentic commerce. The MVP proxy is
    pinned to Agentic Commerce Protocol API-Version 2026-04-17 and forwards ACP request
    bodies unchanged while making authorization decisions from merchant-authoritative
    checkout state.
servers:
  - url: https://mino.example
paths:
  /v1/acp/{merchantId}/checkout_sessions:
    post:
      operationId: createAcpCheckoutSession
      summary: Proxy ACP checkout creation through Mino
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MandateToken'
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/AgentKeyId'
        - $ref: '#/components/parameters/AgentTimestamp'
        - $ref: '#/components/parameters/AgentNonce'
        - $ref: '#/components/parameters/AgentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            description: ACP 2026-04-17 CheckoutSessionCreateRequest, forwarded unchanged.
      responses:
        '200':
          description: Checkout session accepted by Mino policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyDecisionResponse'
        '202':
          description: Checkout session requires a durable human approval decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyDecisionResponse'
        '400':
          $ref: '#/components/responses/ProtocolError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Mino policy blocked the checkout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyDecisionResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /v1/acp/{merchantId}/checkout_sessions/{checkoutSessionId}/complete:
    post:
      operationId: completeAcpCheckoutSession
      summary: Authorize and proxy ACP checkout completion
      description: >-
        Mino retrieves the current merchant CheckoutSession immediately before evaluation,
        applies the active spend mandate and machine-actor controls, atomically reserves
        allowance in Redis, and persists any required ApprovalRequest before notifying the
        approval bridge. An approved retry is accepted only when the same raw request digest,
        merchant-authoritative checkout, policy version, amount, and reviewed soft-limit reasons
        remain valid; hard policy and machine-actor controls are never bypassed. For ALLOW,
        Mino persists a durable payment outcome, extends the reservation into a reconciliation
        hold, emits a short-lived Ed25519 delegation assertion, and only then forwards payment.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - name: checkoutSessionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MandateToken'
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/AgentKeyId'
        - $ref: '#/components/parameters/AgentTimestamp'
        - $ref: '#/components/parameters/AgentNonce'
        - $ref: '#/components/parameters/AgentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            description: ACP 2026-04-17 CheckoutSessionCompleteRequest, forwarded unchanged only after ALLOW.
      responses:
        '200':
          description: Mino allowed the payment operation and the merchant processed or previously processed the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyDecisionResponse'
        '202':
          description: Payment is not forwarded; the durable ApprovalRequest remains pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyDecisionResponse'
        '400':
          $ref: '#/components/responses/ProtocolError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Payment is not forwarded because Mino blocked it, including rejected, expired, or stale approvals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyDecisionResponse'
        '409':
          description: >-
            Either the idempotency key conflicts with a materially different request, or a
            previously forwarded payment still has an unresolved outcome and must be retried
            with the same idempotency key for reconciliation.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IdempotencyConflictError'
                  - $ref: '#/components/schemas/PaymentOutcomePendingError'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /v1/approvals/{approvalRequestId}:
    get:
      operationId: getApprovalRequest
      summary: Read a durable human approval request
      description: >-
        Intended for a trusted approval bridge. The request must be authenticated with a
        timestamped HMAC signature bound to method, exact request path, approver identity,
        and the canonical null body digest.
      parameters:
        - $ref: '#/components/parameters/ApprovalRequestId'
        - $ref: '#/components/parameters/ApproverId'
        - $ref: '#/components/parameters/ApprovalTimestamp'
        - $ref: '#/components/parameters/ApprovalSignature'
      responses:
        '200':
          description: Current durable approval state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '401':
          $ref: '#/components/responses/ApprovalUnauthorized'
        '404':
          description: Approval request was not found.
  /v1/approvals/{approvalRequestId}/votes:
    post:
      operationId: castApprovalVote
      summary: Cast an authenticated human approval vote
      description: >-
        One durable vote is permitted per approver. Replaying the same approver/same decision
        is idempotent. Changing a prior vote or voting after terminal resolution is rejected.
        Any REJECT vote terminally rejects the request; APPROVE resolves only after the required
        number of distinct approvers is reached.
      parameters:
        - $ref: '#/components/parameters/ApprovalRequestId'
        - $ref: '#/components/parameters/ApproverId'
        - $ref: '#/components/parameters/ApprovalTimestamp'
        - $ref: '#/components/parameters/ApprovalSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVE, REJECT]
                comment:
                  type: string
      responses:
        '200':
          description: Vote accepted or idempotently replayed; returns current approval state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '400':
          description: Invalid vote body.
        '401':
          $ref: '#/components/responses/ApprovalUnauthorized'
        '404':
          description: Approval request was not found.
        '409':
          description: Approver changed an existing vote or the ApprovalRequest is already terminal.
components:
  parameters:
    MerchantId:
      name: merchantId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Authorization:
      name: Authorization
      in: header
      required: true
      description: ACP merchant Bearer credential. Mino never treats this as the spend mandate.
      schema: { type: string, pattern: '^Bearer\\s+\\S+$' }
    ApiVersion:
      name: API-Version
      in: header
      required: true
      schema: { type: string, enum: ['2026-04-17'] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    MandateToken:
      name: X-Mino-Mandate-Token
      in: header
      required: true
      description: Short-lived Ed25519-signed Mino spend-mandate token.
      schema: { type: string, minLength: 32 }
    AgentId:
      name: X-Mino-Agent-Id
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    AgentKeyId:
      name: X-Mino-Agent-Key-Id
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    AgentTimestamp:
      name: X-Mino-Agent-Timestamp
      in: header
      required: true
      schema: { type: string, pattern: '^\\d{10}$' }
    AgentNonce:
      name: X-Mino-Agent-Nonce
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    AgentSignature:
      name: X-Mino-Agent-Signature
      in: header
      required: true
      description: Base64url Ed25519 signature over method, path, timestamp, nonce, mandate digest, ACP version, idempotency key, and body digest.
      schema: { type: string, minLength: 32 }
    ApprovalRequestId:
      name: approvalRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApproverId:
      name: X-Mino-Approver-Id
      in: header
      required: true
      description: Stable authenticated identity supplied by the trusted approval bridge.
      schema: { type: string, minLength: 1, maxLength: 255 }
    ApprovalTimestamp:
      name: X-Mino-Approval-Timestamp
      in: header
      required: true
      description: Ten-digit Unix timestamp included in the approval callback HMAC input.
      schema: { type: string, pattern: '^\\d{10}$' }
    ApprovalSignature:
      name: X-Mino-Approval-Signature
      in: header
      required: true
      description: >-
        Hex HMAC-SHA256 over timestamp, uppercase method, exact request path, approver ID,
        and the SHA-256 digest of the canonical request body.
      schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  schemas:
    Money:
      type: object
      required: [currency, minorUnits]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        minorUnits: { type: string, pattern: '^\\d+$' }
    PolicyDecision:
      type: object
      required:
        - decisionId
        - requestId
        - verdict
        - reasons
        - requestedAmount
        - mandateId
        - policyId
        - policyVersion
        - eligibleForDelegationAssertion
        - evaluationLatencyMicros
        - evaluatedAt
      properties:
        decisionId: { type: string }
        requestId: { type: string }
        verdict:
          type: string
          enum: [ALLOW, BLOCK, PENDING_HUMAN_APPROVAL]
        reasons:
          type: array
          items: { type: string }
        requestedAmount: { $ref: '#/components/schemas/Money' }
        policyAmount: { $ref: '#/components/schemas/Money' }
        approvedAmount: { $ref: '#/components/schemas/Money' }
        mandateId: { type: string }
        policyId: { type: string }
        policyVersion: { type: integer }
        eligibleForDelegationAssertion: { type: boolean }
        evaluationLatencyMicros: { type: integer, minimum: 0 }
        evaluatedAt: { type: string, format: date-time }
        approval:
          type: object
          properties:
            required: { type: boolean, enum: [true] }
            approvalMode: { type: string }
            expiresAt: { type: string, format: date-time }
    ProxyDecisionResponse:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/PolicyDecision' }
        checkout_session_id: { type: string }
        approval_request_id:
          type: string
          format: uuid
          description: Durable ApprovalRequest identifier when a human decision is or was involved.
        payment_outcome_id:
          type: string
          description: Durable Mino payment-outcome identifier for a forwarded completion.
        idempotent_replayed:
          type: boolean
          description: True when Mino returned a durable/reconciled result without forwarding another payment.
        upstream:
          type: object
          additionalProperties: true
    ApprovalVote:
      type: object
      required: [approver_id, decision, created_at]
      properties:
        approver_id: { type: string }
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comment: { type: string }
        created_at: { type: string, format: date-time }
    ApprovalRequest:
      type: object
      required:
        - approval_request_id
        - status
        - decision_id
        - request_id
        - merchant_domain
        - amount_minor
        - currency
        - required_signatures
        - votes
        - created_at
        - expires_at
      properties:
        approval_request_id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED]
        decision_id: { type: string }
        request_id: { type: string }
        merchant_domain: { type: string }
        checkout_session_id: { type: string }
        amount_minor: { type: string, pattern: '^\\d+$' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        required_signatures: { type: integer, minimum: 1 }
        votes:
          type: array
          items: { $ref: '#/components/schemas/ApprovalVote' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
    IdempotencyConflictError:
      type: object
      required: [error, reason]
      properties:
        error: { type: string, enum: [IDEMPOTENCY_CONFLICT] }
        reason: { type: string }
    PaymentOutcomePendingError:
      type: object
      required: [error, reason, payment_outcome_id]
      properties:
        error: { type: string, enum: [PAYMENT_OUTCOME_PENDING] }
        reason: { type: string }
        payment_outcome_id: { type: string }
        upstream_status: { type: integer }
  responses:
    ProtocolError:
      description: Unsupported or invalid ACP protocol input.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [PROTOCOL_ERROR] }
              reason: { type: string }
    Unauthorized:
      description: Mandate token or agent request proof failed authentication.
      content:
        application/json:
          schema:
            type: object
            required: [error, reason]
            properties:
              error: { type: string, enum: [UNAUTHORIZED] }
              reason: { type: string }
    ApprovalUnauthorized:
      description: Approval bridge callback authentication failed.
      content:
        application/json:
          schema:
            type: object
            required: [error, reason]
            properties:
              error: { type: string, enum: [UNAUTHORIZED] }
              reason:
                type: string
                enum: [INVALID_APPROVER, INVALID_TIMESTAMP, TIMESTAMP_OUT_OF_RANGE, INVALID_SIGNATURE]
    IdempotencyConflict:
      description: The idempotency key was reused for a materially different request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdempotencyConflictError'
    UpstreamError:
      description: The configured ACP merchant endpoint could not provide a valid response.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [UPSTREAM_ERROR] }
              upstream_status: { type: integer }
