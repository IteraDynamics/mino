# Mino authorization Redis baseline.
#
# The authorization reconstruction marker and its protected state must not be
# selectively evicted. Complete Redis loss is recoverable from PostgreSQL, but
# arbitrary key eviction while the marker survives is outside that safety model.
maxmemory-policy noeviction

# Persist accepted authorization state between ordinary Redis restarts. PostgreSQL
# remains the durable reconstruction source for complete loss.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

# Also retain periodic snapshots as an additional restart/recovery aid.
save 900 1
save 300 10
save 60 10000

# This service is reachable only on the private compose network in the reference
# deployment. Network-layer authentication/TLS should be supplied by the managed
# Redis service or deployment environment when Redis is externalized.
bind 0.0.0.0
protected-mode yes
