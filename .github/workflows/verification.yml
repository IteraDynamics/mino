name: Mino verification gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mino
          POSTGRES_PASSWORD: mino
          POSTGRES_DB: mino
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mino -d mino"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mino:mino@127.0.0.1:5432/mino?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply committed database migrations
        run: npm run prisma:migrate:deploy

      - name: Verify database migration status
        run: npm run prisma:migrate:status

      - name: Verify migrated schema matches Prisma model
        run: >-
          npx prisma migrate diff
          --exit-code
          --from-config-datasource
          --to-schema prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build production container image
        run: docker build --target runtime -t mino:ci .

      - name: Build migration container image
        run: docker build --target migration -t mino:migration-ci .

      - name: Verify container authority split
        run: |
          test "$(docker image inspect mino:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect mino:migration-ci --format '{{.Config.User}}')" = "10001:10001"
          docker image inspect mino:ci --format '{{json .Config.Healthcheck}}' | jq -e '.Test | length > 0'
          docker image inspect mino:ci --format '{{json .Config.Env}}' | jq -e 'all(.[]; contains("SECRET") | not)'
          docker run --rm --entrypoint sh mino:ci -ec 'test ! -e /app/node_modules/.bin/prisma && test ! -d /app/prisma'
          docker run --rm --entrypoint sh mino:migration-ci -ec 'test -x /app/node_modules/.bin/prisma && test -f /app/prisma/migrations/20260815050000_baseline/migration.sql'

      - name: Run migration image with mounted datasource secret
        run: |
          database_secret="$(mktemp)"
          printf '%s' "$DATABASE_URL" > "$database_secret"
          chmod 0644 "$database_secret"
          docker run --rm --network host \
            -e DATABASE_URL_FILE=/run/secrets/database_url \
            -v "$database_secret:/run/secrets/database_url:ro" \
            mino:migration-ci

      - name: Validate hardened Compose runtime
        env:
          MINO_ISSUER: https://mino.example
          MINO_MANDATE_PUBLIC_KEYS_B64_JSON: '{"mino-k1":"placeholder"}'
          MINO_DELEGATION_SIGNING_KEY_ID: delegation-k1
          MINO_AUDIT_SIGNING_KEY_ID: audit-k1
          MINO_AUDIT_PUBLIC_KEYS_B64_JSON: '{"audit-k1":"placeholder"}'
          MINO_APPROVAL_WEBHOOK_URL: https://approvals.example/webhook
          MINO_AUDIT_CHECKPOINT_RETENTION_URL: https://retention.example/checkpoints
        run: |
          secrets_dir="$(mktemp -d)"
          for name in database_url redis_url postgres_password redis_password delegation_private_key.pem audit_private_key.pem approval_resolution_secret approval_webhook_secret merchant_credentials.json audit_checkpoint_retention_secret metrics_bearer_token; do
            printf 'ci-placeholder' > "${secrets_dir}/${name}"
          done
          MINO_DEPLOY_SECRETS_DIR="${secrets_dir}" docker compose -f deploy/docker-compose.runtime.yml config --format json > /tmp/mino-compose.json
          jq -e '.services.mino.read_only == true' /tmp/mino-compose.json
          jq -e '.services.mino.cap_drop == ["ALL"]' /tmp/mino-compose.json
          jq -e '.services.mino.security_opt | index("no-new-privileges:true") != null' /tmp/mino-compose.json
          jq -e '.services.migrate.read_only == true' /tmp/mino-compose.json
          jq -e '.services.migrate.cap_drop == ["ALL"]' /tmp/mino-compose.json
          jq -e '.services.migrate.security_opt | index("no-new-privileges:true") != null' /tmp/mino-compose.json
          jq -e '.services.mino.depends_on.migrate.condition == "service_completed_successfully"' /tmp/mino-compose.json
          jq -e '.networks.backend.internal == true' /tmp/mino-compose.json
          jq -e '(.services.postgres.ports == null) and (.services.redis.ports == null) and (.services.migrate.ports == null)' /tmp/mino-compose.json
          jq -e '.services.mino.ports | length == 1' /tmp/mino-compose.json
